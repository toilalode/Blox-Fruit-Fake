name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Capacitor
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize and Sync Capacitor Android
        run: |
          npx cap init "Blox Fruit Fake" "com.toilalode.bloxfruitfake" --web-dir .
          npx cap add android
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Keystore and Sign APK
        run: |
          # Tạo Keystore ký tự động (hoặc dùng secret nếu có)
          keytool -genkeypair -v -keystore release.keystore -alias bloxfruit -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "blox_fruit_fake_keystore" -keypass "blox_fruit_fake_keystore" \
            -dname "CN=BloxFruit, OU=Gaming, O=BloxFruitFake, L=VN, ST=VN, C=VN"

          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          # Căn chỉnh và ký APK bằng apksigner hoặc jarsigner
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass "blox_fruit_fake_keystore" \
            -keypass "blox_fruit_fake_keystore" "$UNSIGNED_APK" bloxfruit

          mkdir -p output
          cp "$UNSIGNED_APK" output/BloxFruitFake-Signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BloxFruitFake-Signed-APK
          path: output/BloxFruitFake-Signed.apk
          
